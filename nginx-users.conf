# Redirect HTTP ke HTTPS
server {
    listen 80;
    server_name users.pudin.eu.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name users.pudin.eu.org;

    ssl_certificate /etc/cloudflare/pudin.eu.org.pem;
    ssl_certificate_key /etc/cloudflare/pudin.eu.org.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy ke backend CodeIgniter (spark serve via app-user.service, 127.0.0.1:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
